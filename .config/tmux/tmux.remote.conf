# Show status bar at bottom for remote session,
# so it does not stack with the local session's one.
set -g status-position bottom

# Include the remote machine in the parent terminal title.
set -g set-titles-string '#H:#S'

# Set port of SSH remote tunnel, where tmux will pipe buffers to transfer on local machine for copy
set -g @copy_backend_remote_tunnel_port 11988

# Keep the same two-row order: window tabs, then session tabs.
set -g status-format[0] "$tab_line"
set -g status-format[1] "$session_line"
