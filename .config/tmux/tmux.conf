# ==========================
# ===  General settings  ===
# ==========================

# IMPORTANT set -g plugin, tpm, aggressive-resize, and if-shell
# are all commented out as they are making iTerm hang.

set -g default-terminal "screen-256color"
set -g history-limit 20000
set -g buffer-limit 20
set -sg escape-time 0
set -g display-time 1500
set -g remain-on-exit off
set -g repeat-time 300
setw -g allow-rename off
setw -g automatic-rename on
setw -g automatic-rename-format '#{?#{==:#{pane_current_command},zsh},#{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}},#{pane_current_command}}'
# setw -g aggressive-resize on
setw -g aggressive-resize off
set -g renumber-windows on

# Change prefix key to C-a, easier to type, same to "screen"
unbind C-b
set -g prefix C-a

# Set parent terminal title
# Keep long names recognisable by preserving both the project prefix and the
# distinguishing suffix. The 17-character match means names up to 16
# characters are displayed unchanged.
window_title="#{?#{m/r:.................,#{window_name}},#{=8:window_name}…#{=-7:window_name},#{window_name}}"
session_title="#{?#{m/r:.................,#{session_name}},#{=8:session_name}…#{=-7:session_name},#{session_name}}"
set -g set-titles on
# set -g set-titles-string "#I:#W" # current window name
set -g set-titles-string "#H:$session_title:$window_title"

# Start index of window/pane with 1, because we're humans, not computers
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on

# tmux 3.5a selects a window for every status-line click. Session ranges need
# switch-client instead; keep the default behaviour for window tabs.
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},session}' 'switch-client -t=' 'select-window -t='

# Use a session menu on session tabs; retain tmux's normal window menu elsewhere.
bind -n MouseDown3Status if -F '#{==:#{mouse_status_range},session}' \
  'display-menu -T "#[align=centre]#{session_name}" -t = -x M -y S Switch s { switch-client -t "#{session_id}" } "New Window" n { new-window -t "#{session_id}" } Rename r { command-prompt -I "#{session_name}" { rename-session -t "#{session_id}" "%%" } } "" "Detach Clients" d { detach-client -s "#{session_id}" } "" Kill X { confirm-before -p "kill session #{session_name}? (y/n)" { kill-session -t "#{session_id}" } }' \
  'display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W "#{?#{>:#{session_windows},1},,-}Swap Left" l { swap-window -t :-1 } "#{?#{>:#{session_windows},1},,-}Swap Right" r { swap-window -t :+1 } "#{?pane_marked_set,,-}Swap Marked" s { swap-window } "" Kill X { kill-window } Respawn R { respawn-window -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } Rename n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } "" "New After" w { new-window -a } "New At End" W { new-window }'


# ==========================
# ===   Key bindings     ===
# ==========================

# Unbind default key bindings, we're going to override
unbind "\$" # rename-session
unbind ,    # rename-window
unbind %    # split-window -h
unbind '"'  # split-window
unbind '}'  # swap-pane -D
unbind '{'  # swap-pane -U
unbind '['  # paste-buffer
unbind ']'
unbind "'"  # select-window
unbind n    # next-window
unbind p    # previous-window
unbind l    # last-window
unbind M-n  # next window with alert
unbind M-p  # next window with alert
unbind o    # focus thru panes
unbind &    # kill-window
unbind "#"  # list-buffer 
unbind =    # choose-buffer
unbind z    # zoom-pane
unbind M-Up  # resize 5 rows up
unbind M-Down # resize 5 rows down
unbind M-Right # resize 5 rows right
unbind M-Left # resize 5 rows left


# Edit configuration and reload
bind -N 'Edit configuration' C-e new-window -n 'tmux.conf' "sh -c '\${EDITOR:-vim} ~/.config/tmux/tmux.conf && tmux source ~/.config/tmux/tmux.conf && tmux display \"Config reloaded\"'"

# Reload tmux configuration 
bind -N 'Reload configuration' C-r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# new window and retain cwd
bind -N 'New window' c new-window -c "#{pane_current_path}"

# Prompt to rename window right after it's created
# set-hook -g after-new-window 'command-prompt -I "#{window_name}" "rename-window '%%'"'

# Rename session and window
bind -N 'Rename window' r command-prompt -I "#{window_name}" "rename-window '%%'"
bind -N 'Rename session' R command-prompt -I "#{session_name}" "rename-session '%%'"

# Split panes
bind -N 'Split pane horizontally' | split-window -h -c "#{pane_current_path}"
bind -N 'Split pane vertically' _ split-window -v -c "#{pane_current_path}"

# Select pane and windows
bind -N 'Last window' 0 select-window -t ':{end}'  # reserve 0 for the last window
bind -r -N 'Previous window' 'C-[' previous-window
bind -r -N 'Next window' 'C-]' next-window
bind -r -N 'Previous pane' '[' select-pane -t :.-
bind -r -N 'Next pane' ']' select-pane -t :.+
bind -r -N 'Last window' Tab run-shell -b -t "#{pane_id}" "bash ~/.config/tmux/actions.sh run 'Tab' '#{pane_id}'"   # cycle thru MRU tabs
bind -r -N 'Last window' a run-shell -b -t "#{pane_id}" "bash ~/.config/tmux/actions.sh run 'a' '#{pane_id}'"   # cycle thru MRU tabs
bind -r -N 'Last window' C-a last-window   # cycle thru MRU tabs
bind -r -N 'Swap pane down' C-o swap-pane -D

# Zoom pane
bind -N 'Toggle pane zoom' + resize-pane -Z

# Link window
bind -N 'Link window' L command-prompt -p "Link window from (session:window): " "link-window -s %% -a"

# Swap panes back and forth with 1st pane
# When in main-(horizontal|vertical) layouts, the biggest/widest panel is always @1
bind -N 'Swap pane with main pane' '\' if '[ #{pane_index} -eq 1 ]' \
     'swap-pane -s "!"' \
     'select-pane -t:.1 ; swap-pane -d -t 1 -s "!"'

# Kill pane/window/session shortcuts
bind -N 'Kill pane' x confirm-before -p "kill pane? (y/n)" kill-pane
bind -N 'Kill window' X confirm-before -p "kill window? (y/n)" kill-window
bind -N 'Kill other windows' C-x confirm-before -p "kill other windows? (y/n)" "kill-window -a"
bind -N 'Kill session' Q confirm-before -p "kill-session #S? (y/n)" kill-session

# Merge session with another one (e.g. move all windows)
# If you use adhoc 1-window sessions, and you want to preserve session upon exit
# but don't want to create a lot of small unnamed 1-window sessions around
# move all windows from current session to main named one (dev, work, etc)
bind -N 'Merge windows into session' C-u command-prompt -p "Session to merge with: " \
   "run-shell 'yes | head -n #{session_windows} | xargs -I {} -n 1 tmux movew -t %%'"

# Detach from session
bind -N 'Detach client' d detach
bind -N 'Detach other clients' D if -F '#{session_many_attached}' \
    'confirm-before -p "Detach other clients? (y/n)" "detach -a"' \
    'display "Session has only 1 client attached"'

# Hide status bar on demand
bind -N 'Toggle status bar' C-s if -F '#{==:#{status},off}' 'set status 2' 'set status off'

# Show the command palette
unbind P
unbind -q S
unbind -q K
bind -N 'Command palette' k display-popup -h 70% -w 50% -E "sh ~/.config/tmux/command_palette.sh '#{pane_id}' '#{session_id}' '#{pane_current_path}' '#{client_name}'"

# The default prefix-? help only shows documented root and prefix bindings.
# Use prefix-Backspace to inspect every binding in every key table. Most
# terminals encode C-? as Backspace/DEL.
bind -N 'List all key bindings' BSpace list-keys



# ==================================================
# === Window monitoring for activity and silence ===
# ==================================================
bind -N 'Toggle activity monitoring' m setw monitor-activity \; display-message 'Monitor window activity [#{?monitor-activity,ON,OFF}]'
bind -N 'Toggle silence monitoring' M if -F '#{monitor-silence}' \
    'setw monitor-silence 0 ; display-message "Monitor window silence [OFF]"' \
    'command-prompt -p "Monitor silence: interval (s)" "setw monitor-silence %%"'

# Activity bell and whistles
set -g visual-activity on

# TODO: Does not work as well, check on newer versions
# set -g visual-silence on

# BUG: bell-action other ignored · Issue #1027 · tmux/tmux · GitHub - https://github.com/tmux/tmux/issues/1027
# set -g visual-bell on
# setw -g bell-action other

# ================================================
# ===     Copy mode, scroll and clipboard      ===
# ================================================
set -g @copy_use_osc52_fallback on

# Prefer vi style key table
setw -g mode-keys vi

bind -N 'Paste buffer' p paste-buffer
bind -N 'Choose buffer' C-p choose-buffer

# trigger copy mode by
bind -n M-Up copy-mode

# Scroll up/down by 1 line, half screen, whole screen
bind -T copy-mode-vi M-Up              send-keys -X scroll-up
bind -T copy-mode-vi M-Down            send-keys -X scroll-down
bind -T copy-mode-vi M-PageUp          send-keys -X halfpage-up
bind -T copy-mode-vi M-PageDown        send-keys -X halfpage-down
bind -T copy-mode-vi PageDown          send-keys -X page-down
bind -T copy-mode-vi PageUp            send-keys -X page-up

# When scrolling with mouse wheel, reduce number of scrolled rows per tick to "2" (default is 5)
bind -T copy-mode-vi WheelUpPane       select-pane \; send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane     select-pane \; send-keys -X -N 2 scroll-down

# wrap default shell in reattach-to-user-namespace if available
# there is some hack with `exec & reattach`, credits to "https://github.com/gpakosz/.tmux"
# don't really understand how it works, but at least window are not renamed to "reattach-to-user-namespace"
if -b "command -v reattach-to-user-namespace > /dev/null 2>&1" \
    "run 'tmux set -g default-command \"exec $(tmux show -gv default-shell) 2>/dev/null & reattach-to-user-namespace -l $(tmux show -gv default-shell)\"'"

yank="~/.config/tmux/yank.sh"

# Copy selected text
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "$yank"
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "$yank"
bind -T copy-mode-vi Y send-keys -X copy-line \;\
    run "tmux save-buffer - | $yank"
bind-key -T copy-mode-vi D send-keys -X copy-end-of-line \;\
    run "tmux save-buffer - | $yank"
bind -T copy-mode-vi C-j send-keys -X copy-pipe-and-cancel "$yank"
bind-key -T copy-mode-vi A send-keys -X append-selection-and-cancel \;\
    run "tmux save-buffer - | $yank"

# Copy selection on drag end event, but do not cancel copy mode and do not clear selection
# clear select on subsequence mouse click
bind -T copy-mode-vi MouseDragEnd1Pane \
    send-keys -X copy-pipe "$yank"
bind -T copy-mode-vi MouseDown1Pane select-pane \;\
   send-keys -X clear-selection
    
# iTerm2 works with clipboard out of the box, set-clipboard already set to "external"
# tmux show-options -g -s set-clipboard
# set-clipboard on|external
if-shell -b 'tmux show-options -g get-clipboard >/dev/null 2>&1' \
  'set -g get-clipboard both'
if-shell -b 'tmux show-options -g set-clipboard >/dev/null 2>&1' \
  'set -g set-clipboard on'
if-shell -b 'tmux show-options -g allow-passthrough >/dev/null 2>&1' \
  'set -g allow-passthrough on'

# Toggle Option as Alt in Ghostty
bind-key -N 'Toggle Option as Alt' O run-shell 'tmux display-message "$(~/.config/ghostty/toggle-macos-option-alt)"'

# =====================================
# ===           Theme               ===
# =====================================

# Feel free to NOT use this variables at all (remove, rename)
# this are named colors, just for convenience
color_orange="colour166" # 208, 166
color_purple="colour134" # 135, 134
color_green="colour076" # 070
color_blue="colour39"
color_yellow="colour220"
color_red="colour160"
color_black="colour232"
color_white="white" # 015

# This is a theme CONTRACT, you are required to define variables below
# Change values, but not remove/rename variables itself
color_dark="$color_black"
color_light="$color_white"
color_session_text="$color_blue"
color_status_text="colour245"
color_main="$color_blue"
color_secondary="$color_purple"
color_level_ok="$color_green"
color_level_warn="$color_yellow"
color_level_stress="$color_red"
color_window_off_indicator="colour088"
color_window_off_status_bg="colour238"
color_window_off_status_current_bg="colour254"

# =====================================
# ===    Appearence and status bar  ===
# ======================================

set -g mode-style "fg=default,bg=$color_main"

# command line style
set -g message-style "fg=$color_main,bg=$color_dark"

# status line style
set -g status-style "fg=$color_status_text,bg=default"

# window segments in status line
set -g window-status-separator ""
separator_powerline_left=""
separator_powerline_right=""

# setw -g window-status-style "fg=$color_status_text,bg=$color_dark"
setw -g window-status-format " #I:$window_title "
setw -g window-status-current-style "fg=$color_light,bold,bg=$color_main"
setw -g window-status-current-format "#[fg=$color_dark,bg=$color_main]$separator_powerline_right#[default] #I:$window_title# #[fg=$color_main,bg=$color_dark]$separator_powerline_right#[default]"

# when window has monitoring notification
setw -g window-status-activity-style "fg=$color_main"

# outline for active pane
setw -g pane-active-border-style "fg=$color_main"

# general status bar settings
set -g status 2
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

window_list="#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}#[nolist]"

session_list="#[align=#{status-justify}]#{S:#[range=session|#{session_id}]#{?#{==:#{session_name},#{client_session}},#[fg=$color_dark]#[bold]#[bg=$color_secondary] $session_title #[default],#[fg=$color_status_text]#[bg=default] $session_title #[default]}#[norange]}"

# Disable legacy left/right so they don’t clash / surprise you
set -g status-left ""
set -g status-right "#{sysstat_cpu}  #{sysstat_mem}  #{sysstat_loadavg}  $wg_battery #{online_status}"

# define widgets we're going to use in status bar
# note, that this is not the complete list, some of them are loaded from plugins
wg_session="#[fg=$color_session_text] $session_title #[default]"
wg_battery="#{battery_status_fg} #{battery_icon} #{battery_percentage}"
wg_date="#[fg=$color_secondary]%m-%d %H:%M#[default]"
wg_user_host="#[fg=$color_secondary]#(whoami)#[default]@#H"
wg_is_zoomed="#[fg=$color_dark,bg=$color_secondary]#{?window_zoomed_flag,[Z],}#[default]"
# TODO: highlighted for nested local session as well
wg_is_keys_off="#[fg=$color_light,bg=$color_window_off_indicator]#([ $(tmux show-option -qv key-table) = 'off' ] && echo 'OFF')#[default]"

set -g status-left "#{prefix_highlight}"
set -g status-right "#{sysstat_cpu}  #{sysstat_mem}  #{sysstat_loadavg}  $wg_battery #{online_status}"

# Keep window tabs on a row of their own: tmux clips the window list before a
# right-aligned segment, so putting telemetry on this row made tabs lose space.
tab_line="$window_list"

# The supporting row degrades from full telemetry to just session tabs on
# narrower clients, leaving the primary (window) row untouched.
status_context="#{?#{>=:#{client_width},120},#{T:status-right}  ,}#{T:status-left}  #{pane_index}[#{pane_width}x#{pane_height}]  $wg_date  $wg_user_host"
session_line="$session_list#[norange align=right range=right]$status_context#[norange default]"
set -g status-format[0] "$tab_line"
set -g status-format[1] "$session_line"
# Clear the former widget row so a session forced to three rows stays blank.
set -g status-format[2] ""

# online and offline icon for tmux-online-status
set -g @online_icon "#[fg=$color_level_ok]●#[default]"
set -g @offline_icon "#[fg=$color_level_stress]●#[default]"

# Configure view templates for tmux-plugin-sysstat "MEM" and "CPU" widget
set -g @sysstat_cpu_view_tmpl 'C:#[fg=#{cpu.color}]#{cpu.pused}#[default]'
set -g @sysstat_mem_view_tmpl 'M:#[fg=#{mem.color}]#{mem.pused}#[default] #{mem.used}'

# Configure colors for tmux-plugin-sysstat "MEM" and "CPU" widget
set -g @sysstat_cpu_color_low "$color_level_ok"
set -g @sysstat_cpu_color_medium "$color_level_warn"
set -g @sysstat_cpu_color_stress "$color_level_stress"

set -g @sysstat_mem_color_low "$color_level_ok"
set -g @sysstat_mem_color_medium "$color_level_warn"
set -g @sysstat_mem_color_stress "$color_level_stress"

set -g @sysstat_swap_color_low "$color_level_ok"
set -g @sysstat_swap_color_medium "$color_level_warn"
set -g @sysstat_swap_color_stress "$color_level_stress"


# Configure tmux-battery widget colors
set -g @batt_color_full_charge "#[fg=$color_level_ok]"
set -g @batt_color_high_charge "#[fg=$color_level_ok]"
set -g @batt_color_medium_charge "#[fg=$color_level_warn]"
set -g @batt_color_low_charge "#[fg=$color_level_stress]"

# Configure tmux-prefix-highlight colors
set -g @prefix_highlight_output_prefix '['
set -g @prefix_highlight_output_suffix ']'
set -g @prefix_highlight_prefix_prompt '^A'
set -g @prefix_highlight_empty_prompt ' ^A '
set -g @prefix_highlight_fg "$color_dark"
set -g @prefix_highlight_bg "$color_secondary"
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr "fg=$color_dark,bg=$color_secondary"


# =====================================
# ===        Renew environment      ===
# =====================================
set -g update-environment \
  "DISPLAY\
  FZF_DEFAULT_OPTS\
  SSH_ASKPASS\
  SSH_AUTH_SOCK\
  SSH_AGENT_PID\
  SSH_CONNECTION\
  SSH_TTY\
  WINDOWID\
  XAUTHORITY"

bind -N 'Renew environment' '$' run "~/.config/tmux/renew_env.sh"

# ============================
# ===         Sesh         ===
# ============================

bind-key -N 'Session picker' "e" run-shell -b -t "#{pane_id}" "bash ~/.config/tmux/actions.sh run 'e' '#{pane_id}'"

# ============================
# ===       Plugins        ===
# ============================
set-environment -g TMUX_FZF_LAUNCH_KEY "K"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'samoshkin/tmux-plugin-sysstat'
set -g @plugin 'sainnhe/tmux-fzf'

# Plugin properties
set -g @sidebar-tree 't'
set -g @sidebar-tree-focus 'T'
set -g @sidebar-tree-command 'tree -C'

set -g @open-S 'https://www.google.com/search?q='

# ==============================================
# ===   Nesting local and remote sessions     ===
# ==============================================

# Session is considered to be remote when we ssh into host
if-shell 'test -n "$SSH_CLIENT"' \
    'source-file ~/.config/tmux/tmux.remote.conf'

# We want to have single prefix key "C-a", usable both for local and remote session
# we don't want to "C-a" + "a" approach either
# Idea is to turn off all key bindings and prefix handling on local session,
# so that all keystrokes are passed to inner/remote session

# see: toggle on/off all keybindings · Issue #237 · tmux/tmux - https://github.com/tmux/tmux/issues/237

# Also, change some visual styles when window keys are off
bind -T root F12  \
    set prefix None \;\
    set key-table off \;\
    set status-style "fg=$color_status_text,bg=$color_window_off_status_bg" \;\
    set window-status-current-format "#[fg=$color_window_off_status_bg,bg=$color_window_off_status_current_bg]$separator_powerline_right#[default] #I:$window_title# #[fg=$color_window_off_status_current_bg,bg=$color_window_off_status_bg]$separator_powerline_right#[default]" \;\
    set window-status-current-style "fg=$color_dark,bold,bg=$color_window_off_status_current_bg" \;\
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
    refresh-client -S \;\

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u window-status-current-style \;\
  set -u window-status-current-format \;\
  refresh-client -S

set -g lock-command vlock
set -g lock-after-time 300
bind -N 'Lock session' L lock-session

# Bind C-a C-a to send prefix to nested tmux
unbind C-a
bind -N 'Send prefix to nested tmux' C-a send-prefix

# Send a literal F12 to the active pane. Plain F12 toggles key handling above.
bind -N 'Send F12 to pane' F12 send-keys F12

# Run all plugins' scripts
run 'if [ -x ~/.config/tmux/plugins/tpm/tpm ]; then ~/.config/tmux/plugins/tpm/tpm; fi'
unbind -q F

# Source local tmux config if present
if-shell '[ -f ~/.config/tmux/tmux.local.conf ]' \
  'source-file ~/.config/tmux/tmux.local.conf'
